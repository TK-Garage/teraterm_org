<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="380" height="340" viewBox="0 0 380 340">
  <defs>
    <style>
      .bg { fill: #ECECEC; }
      .border { fill: none; stroke: red; stroke-width: 2; }
      .msg-title { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 15px; fill: #111; font-weight: 600; }
      .list-bg { fill: #FFF; stroke: #B0B0B0; stroke-width: 1; rx: 3; }
      .list-row { fill: none; }
      .list-row-sel { fill: #007AFF; rx: 3; }
      .list-text { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 13px; fill: #333; }
      .list-text-sel { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 13px; fill: #FFF; }
      .scrollbar { fill: #C0C0C0; rx: 3; }
      .btn { fill: #F0F0F0; stroke: #B0B0B0; stroke-width: 1; rx: 5; }
      .btn-primary { fill: #007AFF; stroke: #006AE0; stroke-width: 1; rx: 5; }
      .btn-label { font-family: -apple-system, sans-serif; font-size: 13px; fill: #333; text-anchor: middle; }
      .btn-label-w { font-family: -apple-system, sans-serif; font-size: 13px; fill: #FFF; text-anchor: middle; }
      .size-label { font-family: monospace; font-size: 10px; fill: red; }
      .icon { fill: #007AFF; }
    </style>
  </defs>

  <rect width="380" height="340" class="bg" rx="10"/>
  <rect x="1" y="1" width="378" height="338" class="border" rx="10"/>

  <!-- App icon -->
  <rect x="20" y="20" width="40" height="40" rx="8" class="icon" opacity="0.15"/>
  <text x="40" y="47" font-family="-apple-system" font-size="22" fill="#007AFF" text-anchor="middle">☰</text>

  <!-- Title -->
  <text x="75" y="38" class="msg-title">Select Item</text>

  <!-- List view (scroll view with table) -->
  <rect x="20" y="70" width="340" height="200" class="list-bg"/>

  <!-- List items -->
  <rect x="22" y="72" width="320" height="22" class="list-row-sel"/>
  <text x="28" y="87" class="list-text-sel">Item 1 - Server A</text>

  <rect x="22" y="94" width="320" height="22" class="list-row"/>
  <text x="28" y="109" class="list-text">Item 2 - Server B</text>

  <rect x="22" y="116" width="320" height="22" class="list-row"/>
  <text x="28" y="131" class="list-text">Item 3 - Server C</text>

  <rect x="22" y="138" width="320" height="22" class="list-row"/>
  <text x="28" y="153" class="list-text">Item 4 - Server D</text>

  <rect x="22" y="160" width="320" height="22" class="list-row"/>
  <text x="28" y="175" class="list-text">Item 5 - Server E</text>

  <rect x="22" y="182" width="320" height="22" class="list-row"/>
  <text x="28" y="197" class="list-text">Item 6 - Server F</text>

  <rect x="22" y="204" width="320" height="22" class="list-row"/>
  <text x="28" y="219" class="list-text">Item 7 - Server G</text>

  <rect x="22" y="226" width="320" height="22" class="list-row"/>
  <text x="28" y="241" class="list-text">Item 8 - Server H</text>

  <!-- Scrollbar -->
  <rect x="346" y="72" width="8" height="200" fill="#F0F0F0" rx="4"/>
  <rect x="346" y="72" width="8" height="60" class="scrollbar"/>

  <!-- Buttons -->
  <rect x="190" y="288" width="80" height="26" class="btn"/>
  <text x="230" y="305" class="btn-label">Cancel</text>
  <rect x="280" y="288" width="80" height="26" class="btn-primary"/>
  <text x="320" y="305" class="btn-label-w">OK</text>

  <text x="370" y="336" class="size-label" text-anchor="end">380 x 340</text>
</svg>
