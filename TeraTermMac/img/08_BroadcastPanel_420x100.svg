<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="100" viewBox="0 0 420 100">
  <defs>
    <style>
      .bg { fill: #ECECEC; }
      .border { fill: none; stroke: red; stroke-width: 2; }
      .label { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 11px; fill: #666; }
      .title { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 11px; fill: #333; font-weight: 600; }
      .field { fill: #FFF; stroke: #B0B0B0; stroke-width: 1; rx: 3; }
      .btn { fill: #F0F0F0; stroke: #B0B0B0; stroke-width: 1; rx: 5; }
      .btn-label { font-family: -apple-system, sans-serif; font-size: 13px; fill: #333; text-anchor: middle; }
      .size-label { font-family: monospace; font-size: 10px; fill: red; }
    </style>
  </defs>

  <rect width="420" height="100" class="bg"/>
  <rect x="1" y="1" width="418" height="98" class="border"/>

  <!-- Title bar (utility) -->
  <rect x="0" y="0" width="420" height="18" fill="#E8E8E8" stroke="#C0C0C0" stroke-width="1"/>
  <text x="210" y="13" class="title" text-anchor="middle">Broadcast</text>
  <circle cx="10" cy="9" r="4" fill="#FF5F57"/>
  <circle cx="22" cy="9" r="4" fill="#FEBC2E"/>
  <circle cx="34" cy="9" r="4" fill="#28C840"/>

  <!-- Label -->
  <text x="16" y="40" class="label">Broadcast message to all windows:</text>

  <!-- Input row: [textField] [Send] -->
  <rect x="16" y="52" width="310" height="24" class="field"/>
  <text x="24" y="68" font-family="'SF Mono', monospace" font-size="13" fill="#999">command</text>

  <rect x="338" y="52" width="66" height="24" class="btn"/>
  <text x="371" y="68" class="btn-label">Send</text>

  <text x="410" y="96" class="size-label" text-anchor="end">420 x 100</text>
</svg>
