<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="460" height="420" viewBox="0 0 460 420">
  <defs>
    <style>
      .bg { fill: #ECECEC; }
      .border { fill: none; stroke: red; stroke-width: 2; }
      .label { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 13px; fill: #333; }
      .label-r { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 13px; fill: #333; text-anchor: end; }
      .title { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 13px; fill: #333; font-weight: 600; }
      .field { fill: #FFF; stroke: #B0B0B0; stroke-width: 1; rx: 3; }
      .secure { fill: #FFF; stroke: #B0B0B0; stroke-width: 1; rx: 3; }
      .radio-circle { fill: none; stroke: #666; stroke-width: 1.5; }
      .radio-dot { fill: #007AFF; }
      .check-box { fill: none; stroke: #666; stroke-width: 1.5; rx: 2; }
      .check-mark { fill: none; stroke: #007AFF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .btn { fill: #F0F0F0; stroke: #B0B0B0; stroke-width: 1; rx: 5; }
      .btn-primary { fill: #007AFF; stroke: #006AE0; stroke-width: 1; rx: 5; }
      .btn-label { font-family: -apple-system, sans-serif; font-size: 13px; fill: #333; text-anchor: middle; }
      .btn-label-w { font-family: -apple-system, sans-serif; font-size: 13px; fill: #FFF; text-anchor: middle; }
      .sep { stroke: #C0C0C0; stroke-width: 1; }
      .size-label { font-family: monospace; font-size: 10px; fill: red; }
    </style>
  </defs>

  <rect width="460" height="420" class="bg"/>
  <rect x="1" y="1" width="458" height="418" class="border"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="460" height="22" fill="#E8E8E8" stroke="#C0C0C0" stroke-width="1"/>
  <text x="230" y="15" class="title" text-anchor="middle">SSH Authentication</text>
  <circle cx="14" cy="11" r="5" fill="#FF5F57"/>
  <circle cx="30" cy="11" r="5" fill="#FEBC2E"/>
  <circle cx="46" cy="11" r="5" fill="#28C840"/>

  <!-- Username row -->
  <text x="110" y="55" class="label-r">User name:</text>
  <rect x="120" y="40" width="310" height="22" class="field"/>
  <text x="128" y="55" class="label" fill="#999">username</text>

  <!-- Passphrase row -->
  <text x="110" y="83" class="label-r">Passphrase:</text>
  <rect x="120" y="68" width="310" height="22" class="secure"/>
  <text x="128" y="83" class="label" fill="#999">••••••••</text>

  <!-- Auth method radios -->
  <circle cx="36" cy="116" r="6" class="radio-circle"/>
  <circle cx="36" cy="116" r="3" class="radio-dot"/>
  <text x="48" y="120" class="label">Use plain password to log in</text>

  <circle cx="36" cy="140" r="6" class="radio-circle"/>
  <text x="48" y="144" class="label">Use RSA/DSA/ECDSA/ED25519 key to log in</text>

  <circle cx="36" cy="164" r="6" class="radio-circle"/>
  <text x="48" y="168" class="label">Use rhosts to log in (SSH1)</text>

  <circle cx="36" cy="188" r="6" class="radio-circle"/>
  <text x="48" y="192" class="label">Use challenge/response (keyboard-interactive)</text>

  <circle cx="36" cy="212" r="6" class="radio-circle"/>
  <text x="48" y="216" class="label">Use Pageant</text>

  <!-- Private key file row -->
  <text x="110" y="252" class="label-r">Private key file:</text>
  <rect x="120" y="237" width="270" height="22" class="field"/>
  <text x="128" y="252" class="label" fill="#999">~/.ssh/id_rsa</text>
  <rect x="398" y="237" width="30" height="22" class="btn"/>
  <text x="413" y="252" class="btn-label">...</text>

  <!-- Checkboxes -->
  <rect x="28" y="278" width="13" height="13" class="check-box"/>
  <polyline points="31,285 34,289 41,281" class="check-mark"/>
  <text x="46" y="290" class="label">Remember password in memory</text>

  <rect x="28" y="302" width="13" height="13" class="check-box"/>
  <polyline points="31,309 34,313 41,305" class="check-mark"/>
  <text x="46" y="314" class="label">Forward agent</text>

  <!-- Separator -->
  <line x1="0" y1="348" x2="460" y2="348" class="sep"/>

  <!-- Buttons -->
  <rect x="20" y="365" width="80" height="24" class="btn"/>
  <text x="60" y="381" class="btn-label">Help</text>
  <rect x="250" y="365" width="90" height="24" class="btn"/>
  <text x="295" y="381" class="btn-label">Disconnect</text>
  <rect x="350" y="365" width="80" height="24" class="btn-primary"/>
  <text x="390" y="381" class="btn-label-w">OK</text>

  <text x="450" y="415" class="size-label" text-anchor="end">460 x 420</text>
</svg>
