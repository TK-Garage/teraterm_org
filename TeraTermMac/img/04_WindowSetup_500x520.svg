<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="520" viewBox="0 0 500 520">
  <defs>
    <style>
      .bg { fill: #ECECEC; }
      .border { fill: none; stroke: red; stroke-width: 2; }
      .box { fill: #F6F6F6; stroke: #C0C0C0; stroke-width: 1; rx: 4; }
      .label { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 13px; fill: #333; }
      .label-r { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 13px; fill: #333; text-anchor: end; }
      .title { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 13px; fill: #333; font-weight: 600; }
      .boxtitle { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 12px; fill: #555; font-weight: 600; }
      .field { fill: #FFF; stroke: #B0B0B0; stroke-width: 1; rx: 3; }
      .radio-circle { fill: none; stroke: #666; stroke-width: 1.5; }
      .radio-dot { fill: #007AFF; }
      .check-box { fill: none; stroke: #666; stroke-width: 1.5; rx: 2; }
      .check-mark { fill: none; stroke: #007AFF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .slider-track { fill: #D0D0D0; rx: 2; }
      .slider-fill { fill: #007AFF; rx: 2; }
      .slider-thumb { fill: #FFF; stroke: #B0B0B0; stroke-width: 1; }
      .btn { fill: #F0F0F0; stroke: #B0B0B0; stroke-width: 1; rx: 5; }
      .btn-primary { fill: #007AFF; stroke: #006AE0; stroke-width: 1; rx: 5; }
      .btn-label { font-family: -apple-system, sans-serif; font-size: 13px; fill: #333; text-anchor: middle; }
      .btn-label-w { font-family: -apple-system, sans-serif; font-size: 13px; fill: #FFF; text-anchor: middle; }
      .sep { stroke: #C0C0C0; stroke-width: 1; }
      .size-label { font-family: monospace; font-size: 10px; fill: red; }
      .sample { stroke: #B0B0B0; stroke-width: 1; }
    </style>
  </defs>

  <rect width="500" height="520" class="bg"/>
  <rect x="1" y="1" width="498" height="518" class="border"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="500" height="22" fill="#E8E8E8" stroke="#C0C0C0" stroke-width="1"/>
  <text x="250" y="15" class="title" text-anchor="middle">Tera Term: Window setup</text>
  <circle cx="14" cy="11" r="5" fill="#FF5F57"/>
  <circle cx="30" cy="11" r="5" fill="#FEBC2E"/>
  <circle cx="46" cy="11" r="5" fill="#28C840"/>

  <!-- Title row -->
  <text x="60" y="50" class="label-r">Title:</text>
  <rect x="70" y="36" width="400" height="22" class="field"/>
  <text x="78" y="51" class="label" fill="#999">Tera Term</text>

  <!-- Cursor Shape Group Box -->
  <rect x="20" y="68" width="170" height="100" class="box"/>
  <text x="30" y="83" class="boxtitle">Cursor shape</text>
  <circle cx="36" cy="100" r="6" class="radio-circle"/>
  <circle cx="36" cy="100" r="3" class="radio-dot"/>
  <text x="48" y="104" class="label">Block</text>
  <circle cx="36" cy="122" r="6" class="radio-circle"/>
  <text x="48" y="126" class="label">Vertical line</text>
  <circle cx="36" cy="144" r="6" class="radio-circle"/>
  <text x="48" y="148" class="label">Horizontal line</text>

  <!-- Right-side checkboxes -->
  <rect x="220" y="88" width="13" height="13" class="check-box"/>
  <polyline points="223,95 226,99 233,91" class="check-mark"/>
  <text x="238" y="100" class="label">Hide title bar</text>

  <rect x="220" y="110" width="13" height="13" class="check-box"/>
  <text x="238" y="122" class="label">Hide menu bar</text>

  <rect x="220" y="132" width="13" height="13" class="check-box"/>
  <text x="238" y="144" class="label">16 Colors (PC style)</text>

  <!-- Color Group Box -->
  <rect x="20" y="180" width="460" height="170" class="box"/>
  <text x="30" y="195" class="boxtitle">Color</text>

  <!-- Color radios + swap -->
  <circle cx="36" cy="215" r="6" class="radio-circle"/>
  <circle cx="36" cy="215" r="3" class="radio-dot"/>
  <text x="48" y="219" class="label">Text</text>
  <circle cx="110" cy="215" r="6" class="radio-circle"/>
  <text x="122" y="219" class="label">Background</text>
  <rect x="220" y="205" width="100" height="22" class="btn"/>
  <text x="270" y="220" class="btn-label">Swap colors</text>

  <!-- Sample view -->
  <rect x="380" y="210" width="80" height="60" class="sample" fill="#000"/>
  <text x="395" y="245" font-family="monospace" font-size="11" fill="#0F0">Sample</text>

  <!-- R slider row -->
  <text x="42" y="250" class="label-r">R:</text>
  <text x="76" y="250" class="label-r">255</text>
  <rect x="84" y="243" width="200" height="4" class="slider-track"/>
  <rect x="84" y="243" width="200" height="4" class="slider-fill"/>
  <circle cx="284" cy="245" r="7" class="slider-thumb"/>

  <!-- G slider row -->
  <text x="42" y="276" class="label-r">G:</text>
  <text x="76" y="276" class="label-r">255</text>
  <rect x="84" y="269" width="200" height="4" class="slider-track"/>
  <rect x="84" y="269" width="200" height="4" class="slider-fill"/>
  <circle cx="284" cy="271" r="7" class="slider-thumb"/>

  <!-- B slider row -->
  <text x="42" y="302" class="label-r">B:</text>
  <text x="76" y="302" class="label-r">255</text>
  <rect x="84" y="295" width="200" height="4" class="slider-track"/>
  <rect x="84" y="295" width="200" height="4" class="slider-fill"/>
  <circle cx="284" cy="297" r="7" class="slider-thumb"/>

  <!-- Scroll Buffer row -->
  <rect x="20" y="364" width="13" height="13" class="check-box"/>
  <polyline points="23,371 26,375 33,367" class="check-mark"/>
  <text x="38" y="376" class="label">Scroll buffer:</text>
  <rect x="140" y="360" width="70" height="22" class="field"/>
  <text x="148" y="375" class="label">10000</text>
  <text x="218" y="376" class="label">lines</text>

  <!-- Alpha Blending row -->
  <text x="60" y="406" class="label-r">Alpha:</text>
  <rect x="70" y="399" width="200" height="4" class="slider-track"/>
  <rect x="70" y="399" width="200" height="4" class="slider-fill"/>
  <circle cx="270" cy="401" r="7" class="slider-thumb"/>
  <text x="285" y="406" class="label">100%</text>

  <!-- Separator -->
  <line x1="0" y1="440" x2="500" y2="440" class="sep"/>

  <!-- Buttons -->
  <rect x="20" y="458" width="80" height="24" class="btn"/>
  <text x="60" y="474" class="btn-label">Help</text>
  <rect x="310" y="458" width="80" height="24" class="btn"/>
  <text x="350" y="474" class="btn-label">Cancel</text>
  <rect x="400" y="458" width="80" height="24" class="btn-primary"/>
  <text x="440" y="474" class="btn-label-w">OK</text>

  <text x="490" y="515" class="size-label" text-anchor="end">500 x 520</text>
</svg>
