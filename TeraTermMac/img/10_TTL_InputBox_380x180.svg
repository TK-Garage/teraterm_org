<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="380" height="180" viewBox="0 0 380 180">
  <defs>
    <style>
      .bg { fill: #ECECEC; }
      .border { fill: none; stroke: red; stroke-width: 2; }
      .msg-title { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 15px; fill: #111; font-weight: 600; }
      .msg-body { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 13px; fill: #444; }
      .field { fill: #FFF; stroke: #B0B0B0; stroke-width: 1; rx: 3; }
      .btn { fill: #F0F0F0; stroke: #B0B0B0; stroke-width: 1; rx: 5; }
      .btn-primary { fill: #007AFF; stroke: #006AE0; stroke-width: 1; rx: 5; }
      .btn-label { font-family: -apple-system, sans-serif; font-size: 13px; fill: #333; text-anchor: middle; }
      .btn-label-w { font-family: -apple-system, sans-serif; font-size: 13px; fill: #FFF; text-anchor: middle; }
      .size-label { font-family: monospace; font-size: 10px; fill: red; }
      .icon { fill: #007AFF; }
    </style>
  </defs>

  <rect width="380" height="180" class="bg" rx="10"/>
  <rect x="1" y="1" width="378" height="178" class="border" rx="10"/>

  <!-- App icon -->
  <rect x="20" y="20" width="40" height="40" rx="8" class="icon" opacity="0.15"/>
  <text x="40" y="47" font-family="-apple-system" font-size="22" fill="#007AFF" text-anchor="middle">?</text>

  <!-- Title & prompt -->
  <text x="75" y="38" class="msg-title">Input Title</text>
  <text x="75" y="58" class="msg-body">Enter your value:</text>

  <!-- Input field (accessoryView) -->
  <rect x="20" y="80" width="340" height="24" class="field"/>
  <text x="28" y="96" font-family="-apple-system" font-size="13" fill="#999">text input</text>

  <!-- Buttons -->
  <rect x="190" y="125" width="80" height="26" class="btn"/>
  <text x="230" y="142" class="btn-label">Cancel</text>
  <rect x="280" y="125" width="80" height="26" class="btn-primary"/>
  <text x="320" y="142" class="btn-label-w">OK</text>

  <text x="370" y="176" class="size-label" text-anchor="end">380 x 180</text>
</svg>
