<svg xmlns="http://www.w3.org/2000/svg" width="500" height="320" font-family="MS UI Gothic, Meiryo, sans-serif" font-size="11">
  <defs>
    <style>
      .title-bar { fill: #0078d4; }
      .title-text { fill: white; font-size: 11px; font-weight: bold; }
      .dialog-bg { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .group-box { fill: none; stroke: #999; stroke-width: 1; }
      .label { fill: #000; font-size: 11px; }
      .edit-box { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .combo-box { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .button { fill: #e1e1e1; stroke: #adadad; stroke-width: 1; }
      .button-default { fill: #0078d4; stroke: #005a9e; stroke-width: 1; }
      .button-text { fill: #000; font-size: 11px; text-anchor: middle; }
      .button-text-default { fill: #fff; font-size: 11px; text-anchor: middle; }
      .checkbox { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .radio { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .combo-arrow { fill: #606060; }
      .text-area { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .scrollbar { fill: #c0c0c0; stroke: #999; stroke-width: 1; }
      .sample-box { fill: #000; stroke: #333; stroke-width: 2; }
      .link { fill: #0066cc; font-size: 11px; text-decoration: underline; }
      .tab-active { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .tab-inactive { fill: #d0d0d0; stroke: #999; stroke-width: 1; }
      .tab-text { fill: #000; font-size: 10px; text-anchor: middle; }
      .listbox { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .progress-bar { fill: #0078d4; }
      .progress-bg { fill: #e0e0e0; stroke: #999; stroke-width: 1; }
    </style>
  </defs>
  <!-- Title bar -->
  <rect class="title-bar" x="0" y="0" width="500" height="22" rx="4"/>
  <text class="title-text" x="8" y="15">Tera Term: その他の設定 - テーマ</text>
  <rect class="dialog-bg" x="0" y="22" width="500" height="298"/>
  <rect class="group-box" x="16" y="36" width="466" height="60"/>
  <text class="label" x="24" y="36" font-weight="bold">プレビュー/ファイル</text>
  <rect class="button" x="30" y="52" width="80" height="24" rx="3"/>
  <text class="button-text" x="70" y="68">読み込み</text>
  <rect class="button" x="120" y="52" width="80" height="24" rx="3"/>
  <text class="button-text" x="160" y="68">保存</text>
  <rect class="group-box" x="16" y="106" width="466" height="60"/>
  <text class="label" x="24" y="106" font-weight="bold">背景</text>
  <text class="label" x="30" y="130">背景画像:</text>
  <rect class="edit-box" x="100" y="118" width="300" height="20"/>
  <rect class="button" x="408" y="116" width="60" height="24" rx="3"/>
  <text class="button-text" x="438" y="132">参照...</text>
  <rect class="group-box" x="16" y="176" width="466" height="80"/>
  <text class="label" x="24" y="176" font-weight="bold">文字色</text>
  <text class="label" x="30" y="200">テーマカラー設定</text>
  <rect class="button-default" x="130" y="280" width="64" height="24" rx="3"/>
  <text class="button-text-default" x="162" y="296">OK</text>
  <rect class="button" x="206" y="280" width="80" height="24" rx="3"/>
  <text class="button-text" x="246" y="296">キャンセル</text>
</svg>