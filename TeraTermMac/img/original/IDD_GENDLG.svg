<svg xmlns="http://www.w3.org/2000/svg" width="420" height="290" font-family="MS UI Gothic, Meiryo, sans-serif" font-size="11">
  <defs>
    <style>
      .title-bar { fill: #0078d4; }
      .title-text { fill: white; font-size: 11px; font-weight: bold; }
      .dialog-bg { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .group-box { fill: none; stroke: #999; stroke-width: 1; }
      .label { fill: #000; font-size: 11px; }
      .edit-box { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .combo-box { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .button { fill: #e1e1e1; stroke: #adadad; stroke-width: 1; }
      .button-default { fill: #0078d4; stroke: #005a9e; stroke-width: 1; }
      .button-text { fill: #000; font-size: 11px; text-anchor: middle; }
      .button-text-default { fill: #fff; font-size: 11px; text-anchor: middle; }
      .checkbox { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .radio { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .combo-arrow { fill: #606060; }
      .text-area { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .scrollbar { fill: #c0c0c0; stroke: #999; stroke-width: 1; }
      .sample-box { fill: #000; stroke: #333; stroke-width: 2; }
      .link { fill: #0066cc; font-size: 11px; text-decoration: underline; }
      .tab-active { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .tab-inactive { fill: #d0d0d0; stroke: #999; stroke-width: 1; }
      .tab-text { fill: #000; font-size: 10px; text-anchor: middle; }
      .listbox { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .progress-bar { fill: #0078d4; }
      .progress-bg { fill: #e0e0e0; stroke: #999; stroke-width: 1; }
    </style>
  </defs>
  <!-- Title bar -->
  <rect class="title-bar" x="0" y="0" width="420" height="22" rx="4"/>
  <text class="title-text" x="8" y="15">Tera Term: 全般設定</text>
  <rect class="dialog-bg" x="0" y="22" width="420" height="268"/>
  <text class="label" x="16" y="42">新しい接続のデフォルト:</text>
  <circle class="radio" cx="30" cy="58" r="6"/>
  <circle fill="#000" cx="30" cy="58" r="3"/>
  <text class="label" x="42" y="62">TCP/IP</text>
  <circle class="radio" cx="120" cy="58" r="6"/>
  <text class="label" x="132" y="62">シリアル</text>
  <text class="label" x="16" y="84">UI言語:</text>
  <rect class="combo-box" x="34" y="92" width="254" height="20"/>
  <rect fill="#e1e1e1" x="268" y="92" width="20" height="20" stroke="#7a7a7a" stroke-width="1"/>
  <polygon class="combo-arrow" points="273,100 283,100 278,107"/>
  <text class="label" x="40" y="106">Japanese</text>
  <rect class="edit-box" x="36" y="122" width="362" height="116"/>
  <text class="label" fill="#888" x="44" y="140">言語情報</text>
  <rect class="button-default" x="90" y="254" width="64" height="24" rx="3"/>
  <text class="button-text-default" x="122" y="270">OK</text>
  <rect class="button" x="166" y="254" width="80" height="24" rx="3"/>
  <text class="button-text" x="206" y="270">キャンセル</text>
  <rect class="button" x="258" y="254" width="72" height="24" rx="3"/>
  <text class="button-text" x="294" y="270">ヘルプ(&H)</text>
</svg>