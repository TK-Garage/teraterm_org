<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="280" height="140" viewBox="0 0 280 140">
  <defs>
    <style>
      .bg { fill: rgba(30,30,30,0.85); }
      .border { fill: none; stroke: red; stroke-width: 2; }
      .label { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 13px; fill: #EEE; font-weight: 600; }
      .line-label { font-family: 'SF Mono', 'Menlo', monospace; font-size: 20px; fill: #AAA; font-weight: 500; }
      .title { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 11px; fill: #CCC; font-weight: 600; }
      .btn-hud { fill: rgba(255,255,255,0.15); stroke: rgba(255,255,255,0.3); stroke-width: 1; rx: 5; }
      .btn-stop { fill: rgba(255,59,48,0.3); stroke: rgba(255,59,48,0.6); stroke-width: 1; rx: 5; }
      .btn-label { font-family: -apple-system, sans-serif; font-size: 13px; fill: #EEE; text-anchor: middle; }
      .btn-label-red { font-family: -apple-system, sans-serif; font-size: 13px; fill: #FF3B30; text-anchor: middle; }
      .size-label { font-family: monospace; font-size: 10px; fill: red; }
    </style>
  </defs>

  <rect width="280" height="140" class="bg" rx="8"/>
  <rect x="1" y="1" width="278" height="138" class="border" rx="8"/>

  <!-- Title bar (utility style) -->
  <rect x="0" y="0" width="280" height="18" fill="rgba(60,60,60,0.8)" rx="8"/>
  <text x="140" y="13" class="title" text-anchor="middle">Macro</text>

  <!-- Macro name -->
  <text x="16" y="42" class="label">connect_server.ttl</text>

  <!-- Line number (centered) -->
  <text x="140" y="74" class="line-label" text-anchor="middle">Line: 42</text>

  <!-- Buttons -->
  <rect x="16" y="95" width="116" height="26" class="btn-hud"/>
  <text x="74" y="112" class="btn-label">Pause</text>

  <rect x="148" y="95" width="116" height="26" class="btn-stop"/>
  <text x="206" y="112" class="btn-label-red">Stop</text>

  <text x="270" y="136" class="size-label" text-anchor="end">280 x 140</text>
</svg>
