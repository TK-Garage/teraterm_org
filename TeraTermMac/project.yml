name: TeraTermMac
options:
  bundleIdPrefix: com.teraterm
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

targets:
  TeraTermMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/TeraTermMac
        excludes:
          - Resources
    resources:
      - path: Sources/TeraTermMac/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teraterm.mac
        PRODUCT_NAME: "Tera Term Mac"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Sources/TeraTermMac/Resources/Info.plist
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: Sources/TeraTermMac/Resources/Info.plist
      properties:
        CFBundleName: "Tera Term Mac"
        CFBundleDisplayName: "Tera Term Mac"
        CFBundleIdentifier: com.teraterm.mac
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: TeraTermMac
        LSMinimumSystemVersion: "13.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true

  TeraTermMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TeraTermMacTests
    dependencies:
      - target: TeraTermMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teraterm.mac.tests
        SWIFT_VERSION: "5.9"
