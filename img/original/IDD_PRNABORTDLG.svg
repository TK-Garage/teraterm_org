<svg xmlns="http://www.w3.org/2000/svg" width="142" height="108" font-family="Tahoma, MS Shell Dlg, sans-serif" font-size="11">
  <defs>
    <style>
      .title-bar { fill: #0078d4; }
      .title-text { fill: white; font-size: 11px; font-weight: bold; }
      .dialog-bg { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .label { fill: #000; font-size: 11px; text-anchor: middle; }
      .button { fill: #e1e1e1; stroke: #adadad; stroke-width: 1; }
      .button-text { fill: #000; font-size: 11px; text-anchor: middle; }
    </style>
  </defs>
  <rect class="title-bar" x="0" y="0" width="142" height="22" rx="4"/>
  <text class="title-text" x="8" y="15">Tera Term</text>
  <rect class="dialog-bg" x="0" y="22" width="142" height="86"/>
  <text class="label" x="71" y="52">Printing</text>
  <rect class="button" x="41" y="68" width="60" height="24" rx="3"/>
  <text class="button-text" x="71" y="84">Cancel</text>
</svg>
