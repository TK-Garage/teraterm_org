<svg xmlns="http://www.w3.org/2000/svg" width="526" height="130" font-family="Tahoma, MS Shell Dlg, sans-serif" font-size="11">
  <defs>
    <style>
      .title-bar { fill: #c42b1c; }
      .title-text { fill: white; font-size: 11px; font-weight: bold; }
      .dialog-bg { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .label { fill: #000; font-size: 11px; }
      .edit-box { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .button { fill: #e1e1e1; stroke: #adadad; stroke-width: 1; }
      .button-text { fill: #000; font-size: 11px; text-anchor: middle; }
    </style>
  </defs>
  <rect class="title-bar" x="0" y="0" width="526" height="22" rx="4"/>
  <text class="title-text" x="8" y="15">MACRO: Error</text>
  <rect class="dialog-bg" x="0" y="22" width="526" height="108"/>
  <text class="label" x="16" y="44" fill="#c42b1c">Error message text</text>
  <text class="label" x="450" y="44" text-anchor="end">Line: 1</text>
  <rect class="edit-box" x="16" y="52" width="494" height="20"/>
  <text class="label" x="22" y="66" fill="#666">Error line content</text>
  <rect class="button" x="100" y="86" width="100" height="24" rx="3"/>
  <text class="button-text" x="150" y="102">Stop macro</text>
  <rect class="button" x="216" y="86" width="100" height="24" rx="3"/>
  <text class="button-text" x="266" y="102">Continue</text>
  <rect class="button" x="332" y="86" width="80" height="24" rx="3"/>
  <text class="button-text" x="372" y="102">Help</text>
</svg>
