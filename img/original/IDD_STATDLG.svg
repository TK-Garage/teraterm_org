<svg xmlns="http://www.w3.org/2000/svg" width="104" height="72" font-family="Tahoma, MS Shell Dlg, sans-serif" font-size="11">
  <defs>
    <style>
      .title-bar { fill: #0078d4; }
      .title-text { fill: white; font-size: 11px; font-weight: bold; }
      .dialog-bg { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .label { fill: #000; font-size: 11px; }
    </style>
  </defs>
  <rect class="title-bar" x="0" y="0" width="104" height="22" rx="4"/>
  <text class="title-text" x="8" y="15">Status</text>
  <rect class="dialog-bg" x="0" y="22" width="104" height="50"/>
  <text class="label" x="16" y="50">Processing...</text>
</svg>
