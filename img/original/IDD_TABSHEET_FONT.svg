<svg xmlns="http://www.w3.org/2000/svg" width="540" height="360" font-family="Tahoma, MS Shell Dlg, sans-serif" font-size="11">
  <defs>
    <style>
      .dialog-bg { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .label { fill: #000; font-size: 11px; }
      .edit-box { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .combo-box { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .checkbox { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .button { fill: #e1e1e1; stroke: #adadad; stroke-width: 1; }
      .button-text { fill: #000; font-size: 11px; text-anchor: middle; }
      .group-box { fill: none; stroke: #999; stroke-width: 1; }
      .combo-arrow { fill: #606060; }
      .tab-active { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .tab-inactive { fill: #e0e0e0; stroke: #999; stroke-width: 1; }
      .tab-text { fill: #000; font-size: 10px; text-anchor: middle; }
    </style>
  </defs>
  <rect class="tab-inactive" x="315" y="0" width="55" height="24" rx="3"/>
  <text class="tab-text" x="342" y="16">Coding</text>
  <rect class="tab-active" x="372" y="0" width="40" height="24" rx="3"/>
  <text class="tab-text" x="392" y="16" font-weight="bold">Font</text>
  <rect class="dialog-bg" x="0" y="22" width="540" height="338"/>
  <!-- VT Window Font -->
  <text class="label" x="16" y="44" font-weight="bold">VT Window Font</text>
  <text class="label" x="16" y="66">Current font:</text>
  <rect class="edit-box" x="120" y="54" width="300" height="20"/>
  <text class="label" x="126" y="68" fill="#666">Menlo 14pt</text>
  <rect class="button" x="430" y="54" width="80" height="20" rx="2"/>
  <text class="button-text" x="470" y="68">Select...</text>
  <rect class="checkbox" x="16" y="84" width="13" height="13"/>
  <text class="label" x="34" y="95">List proportional fonts</text>
  <rect class="checkbox" x="200" y="84" width="13" height="13"/>
  <text class="label" x="218" y="95">List hidden fonts</text>
  <text class="label" fill="#0066cc" x="16" y="116" text-decoration="underline">Open font folder</text>
  <rect class="checkbox" x="16" y="128" width="13" height="13"/>
  <text class="label" x="34" y="139">Resized font</text>
  <!-- Drawing API -->
  <text class="label" x="16" y="166">Drawing API:</text>
  <rect class="combo-box" x="120" y="154" width="180" height="20"/>
  <rect fill="#e1e1e1" x="280" y="154" width="20" height="20" stroke="#7a7a7a" stroke-width="1"/>
  <polygon class="combo-arrow" points="285,162 295,162 290,169"/>
  <!-- Code page -->
  <text class="label" x="16" y="194">Code page:</text>
  <rect class="edit-box" x="120" y="182" width="80" height="20"/>
  <!-- Character space group -->
  <rect class="group-box" x="16" y="214" width="508" height="80"/>
  <text class="label" x="24" y="214" font-weight="bold">Character space</text>
  <text class="label" x="30" y="240">Top:</text>
  <rect class="edit-box" x="70" y="228" width="40" height="20"/>
  <text class="label" x="130" y="240">Bottom:</text>
  <rect class="edit-box" x="180" y="228" width="40" height="20"/>
  <text class="label" x="30" y="268">Left:</text>
  <rect class="edit-box" x="70" y="256" width="40" height="20"/>
  <text class="label" x="130" y="268">Right:</text>
  <rect class="edit-box" x="180" y="256" width="40" height="20"/>
</svg>
