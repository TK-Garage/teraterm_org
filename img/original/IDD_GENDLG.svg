<svg xmlns="http://www.w3.org/2000/svg" width="418" height="288" font-family="MS Shell Dlg, Tahoma, sans-serif" font-size="11">
  <defs>
    <style>
      .title-bar { fill: #0078d4; }
      .title-text { fill: white; font-size: 11px; font-weight: bold; }
      .dialog-bg { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .label { fill: #000; font-size: 11px; }
      .edit-box { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .combo-box { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .button { fill: #e1e1e1; stroke: #adadad; stroke-width: 1; }
      .button-default { fill: #0078d4; stroke: #005a9e; stroke-width: 1; }
      .button-text { fill: #000; font-size: 11px; text-anchor: middle; }
      .button-text-default { fill: #fff; font-size: 11px; text-anchor: middle; }
      .combo-arrow { fill: #606060; }
    </style>
  </defs>
  <rect class="title-bar" x="0" y="0" width="418" height="22" rx="4"/>
  <text class="title-text" x="8" y="15">Tera Term: General setup</text>
  <rect class="dialog-bg" x="0" y="22" width="418" height="266"/>
  <!-- Language/UI -->
  <text class="label" x="16" y="42">Language&amp;UI:</text>
  <rect class="combo-box" x="34" y="52" width="254" height="20"/>
  <rect fill="#e1e1e1" x="268" y="52" width="20" height="20" stroke="#7a7a7a" stroke-width="1"/>
  <polygon class="combo-arrow" points="273,60 283,60 278,67"/>
  <text class="label" x="40" y="66">English</text>
  <!-- Info text area -->
  <rect class="edit-box" x="36" y="82" width="362" height="146"/>
  <text class="label" fill="#888" x="44" y="100">Language information</text>
  <!-- Buttons -->
  <rect class="button-default" x="84" y="250" width="80" height="24" rx="3"/>
  <text class="button-text-default" x="124" y="266">OK</text>
  <rect class="button" x="176" y="250" width="80" height="24" rx="3"/>
  <text class="button-text" x="216" y="266">Cancel</text>
  <rect class="button" x="268" y="250" width="80" height="24" rx="3"/>
  <text class="button-text" x="308" y="266">Help</text>
</svg>
