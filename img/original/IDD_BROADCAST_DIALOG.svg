<svg xmlns="http://www.w3.org/2000/svg" width="520" height="400" font-family="MS UI Gothic, Meiryo, sans-serif" font-size="11">
  <defs>
    <style>
      .title-bar { fill: #0078d4; }
      .title-text { fill: white; font-size: 11px; font-weight: bold; }
      .dialog-bg { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .group-box { fill: none; stroke: #999; stroke-width: 1; }
      .label { fill: #000; font-size: 11px; }
      .edit-box { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .combo-box { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .button { fill: #e1e1e1; stroke: #adadad; stroke-width: 1; }
      .button-default { fill: #0078d4; stroke: #005a9e; stroke-width: 1; }
      .button-text { fill: #000; font-size: 11px; text-anchor: middle; }
      .button-text-default { fill: #fff; font-size: 11px; text-anchor: middle; }
      .checkbox { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .radio { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .combo-arrow { fill: #606060; }
      .text-area { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .scrollbar { fill: #c0c0c0; stroke: #999; stroke-width: 1; }
      .sample-box { fill: #000; stroke: #333; stroke-width: 2; }
      .link { fill: #0066cc; font-size: 11px; text-decoration: underline; }
      .tab-active { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .tab-inactive { fill: #d0d0d0; stroke: #999; stroke-width: 1; }
      .tab-text { fill: #000; font-size: 10px; text-anchor: middle; }
      .listbox { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .progress-bar { fill: #0078d4; }
      .progress-bg { fill: #e0e0e0; stroke: #999; stroke-width: 1; }
    </style>
  </defs>
  <!-- Title bar -->
  <rect class="title-bar" x="0" y="0" width="520" height="22" rx="4"/>
  <text class="title-text" x="8" y="15">Tera Term: コマンドのブロードキャスト</text>
  <rect class="dialog-bg" x="0" y="22" width="520" height="378"/>
  <rect class="edit-box" x="16" y="32" width="486" height="60"/>
  <rect class="checkbox" x="16" y="100" width="13" height="13"/>
  <text class="label" x="34" y="111">リアルタイム</text>
  <text class="label" x="16" y="130">ヒストリ</text>
  <rect class="combo-box" x="80" y="118" width="254" height="20"/>
  <rect fill="#e1e1e1" x="314" y="118" width="20" height="20" stroke="#7a7a7a" stroke-width="1"/>
  <polygon class="combo-arrow" points="319,126 329,126 324,133"/>
  <rect class="listbox" x="16" y="150" width="486" height="170"/>
  <rect class="checkbox" x="16" y="330" width="13" height="13"/>
  <text class="label" x="34" y="341">このプロセスのみに送信</text>
  <rect class="checkbox" x="200" y="330" width="13" height="13"/>
  <text class="label" x="218" y="341">Enterキー</text>
  <rect class="button" x="16" y="358" width="80" height="24" rx="3"/>
  <text class="button-text" x="56" y="374">送信</text>
  <rect class="button" x="110" y="358" width="80" height="24" rx="3"/>
  <text class="button-text" x="150" y="374">閉じる</text>
  <rect class="button" x="204" y="358" width="80" height="24" rx="3"/>
  <text class="button-text" x="244" y="374">ヘルプ(&H)</text>
</svg>