<svg xmlns="http://www.w3.org/2000/svg" width="444" height="318" font-family="Tahoma, MS Shell Dlg, sans-serif" font-size="11">
  <defs>
    <style>
      .title-bar { fill: #0078d4; }
      .title-text { fill: white; font-size: 11px; font-weight: bold; }
      .dialog-bg { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .label { fill: #000; font-size: 11px; }
      .edit-box { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .list-box { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .button { fill: #e1e1e1; stroke: #adadad; stroke-width: 1; }
      .button-default { fill: #0078d4; stroke: #005a9e; stroke-width: 1; }
      .button-text { fill: #000; font-size: 11px; text-anchor: middle; }
      .button-text-default { fill: #fff; font-size: 11px; text-anchor: middle; }
    </style>
  </defs>
  <rect class="title-bar" x="0" y="0" width="444" height="22" rx="4"/>
  <text class="title-text" x="8" y="15">Edit History</text>
  <rect class="dialog-bg" x="0" y="22" width="444" height="296"/>
  <text class="label" x="16" y="44">Host:</text>
  <rect class="edit-box" x="16" y="52" width="330" height="20"/>
  <rect class="button" x="356" y="52" width="72" height="20" rx="2"/>
  <text class="button-text" x="392" y="66">Add</text>
  <text class="label" x="16" y="90">History:</text>
  <rect class="list-box" x="16" y="98" width="330" height="160"/>
  <rect class="button" x="356" y="98" width="72" height="24" rx="3"/>
  <text class="button-text" x="392" y="114">Up</text>
  <rect class="button" x="356" y="130" width="72" height="24" rx="3"/>
  <text class="button-text" x="392" y="146">Remove</text>
  <rect class="button" x="356" y="162" width="72" height="24" rx="3"/>
  <text class="button-text" x="392" y="178">Down</text>
  <rect class="button-default" x="100" y="276" width="64" height="24" rx="3"/>
  <text class="button-text-default" x="132" y="292">OK</text>
  <rect class="button" x="180" y="276" width="80" height="24" rx="3"/>
  <text class="button-text" x="220" y="292">Cancel</text>
  <rect class="button" x="276" y="276" width="72" height="24" rx="3"/>
  <text class="button-text" x="312" y="292">Help</text>
</svg>
