<svg xmlns="http://www.w3.org/2000/svg" width="400" height="222" font-family="MS Shell Dlg, Tahoma, sans-serif" font-size="11">
  <defs>
    <style>
      .title-bar { fill: #0078d4; }
      .title-text { fill: white; font-size: 11px; font-weight: bold; }
      .dialog-bg { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .label { fill: #000; font-size: 11px; }
      .list-box { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .button { fill: #e1e1e1; stroke: #adadad; stroke-width: 1; }
      .button-default { fill: #0078d4; stroke: #005a9e; stroke-width: 1; }
      .button-text { fill: #000; font-size: 11px; text-anchor: middle; }
      .button-text-default { fill: #fff; font-size: 11px; text-anchor: middle; }
    </style>
  </defs>
  <rect class="title-bar" x="0" y="0" width="400" height="22" rx="4"/>
  <text class="title-text" x="8" y="15">Tera Term: Window list</text>
  <rect class="dialog-bg" x="0" y="22" width="400" height="200"/>
  <text class="label" x="14" y="42">Window:</text>
  <rect class="list-box" x="14" y="48" width="254" height="150"/>
  <rect class="button-default" x="286" y="36" width="100" height="24" rx="3"/>
  <text class="button-text-default" x="336" y="52">Open</text>
  <rect class="button" x="286" y="66" width="100" height="24" rx="3"/>
  <text class="button-text" x="336" y="82">Cancel</text>
  <rect class="button" x="286" y="96" width="100" height="24" rx="3"/>
  <text class="button-text" x="336" y="112">Close window</text>
  <rect class="button" x="286" y="150" width="100" height="24" rx="3"/>
  <text class="button-text" x="336" y="166">Help</text>
</svg>
