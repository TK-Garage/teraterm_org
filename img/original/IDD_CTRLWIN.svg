  <rect class="dialog-bg" x="0" y="22" width="232" height="122"/>
  <rect class="button" x="16" y="36" width="90" height="24" rx="3"/>
  <text class="button-text" x="61" y="52">Pause</text>
  <rect class="button" x="120" y="36" width="90" height="24" rx="3"/>
  <text class="button-text" x="165" y="52">End</text>
  <text class="label" x="16" y="82">LineNo:</text>
  <text class="label" x="80" y="82" fill="#666">1</text>
  <text class="label" x="16" y="102">File:</text>
  <text class="label" x="80" y="102" fill="#666">script.ttl</text>
</svg>
