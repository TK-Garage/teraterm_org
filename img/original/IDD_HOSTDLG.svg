<svg xmlns="http://www.w3.org/2000/svg" width="490" height="230" font-family="MS UI Gothic, Meiryo, sans-serif" font-size="11">
  <defs>
    <style>
      .title-bar { fill: #0078d4; }
      .title-text { fill: white; font-size: 11px; font-weight: bold; }
      .dialog-bg { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .group-box { fill: none; stroke: #999; stroke-width: 1; }
      .label { fill: #000; font-size: 11px; }
      .edit-box { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .combo-box { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .button { fill: #e1e1e1; stroke: #adadad; stroke-width: 1; }
      .button-default { fill: #0078d4; stroke: #005a9e; stroke-width: 1; }
      .button-text { fill: #000; font-size: 11px; text-anchor: middle; }
      .button-text-default { fill: #fff; font-size: 11px; text-anchor: middle; }
      .checkbox { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .radio { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .combo-arrow { fill: #606060; }
      .text-area { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .scrollbar { fill: #c0c0c0; stroke: #999; stroke-width: 1; }
      .sample-box { fill: #000; stroke: #333; stroke-width: 2; }
      .link { fill: #0066cc; font-size: 11px; text-decoration: underline; }
      .tab-active { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .tab-inactive { fill: #d0d0d0; stroke: #999; stroke-width: 1; }
      .tab-text { fill: #000; font-size: 10px; text-anchor: middle; }
      .listbox { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .progress-bar { fill: #0078d4; }
      .progress-bg { fill: #e0e0e0; stroke: #999; stroke-width: 1; }
    </style>
  </defs>
  <!-- Title bar -->
  <rect class="title-bar" x="0" y="0" width="490" height="22" rx="4"/>
  <text class="title-text" x="8" y="15">Tera Term: 新しい接続</text>
  <rect class="dialog-bg" x="0" y="22" width="490" height="208"/>
  <rect class="group-box" x="8" y="30" width="466" height="100"/>
  <circle class="radio" cx="20" cy="48" r="6"/>
  <circle fill="#000" cx="20" cy="48" r="3"/>
  <text class="label" x="32" y="52">TCP/IP</text>
  <text class="label" x="124" y="48" text-anchor="end">ホスト:</text>
  <rect class="combo-box" x="190" y="36" width="276" height="20"/>
  <rect fill="#e1e1e1" x="446" y="36" width="20" height="20" stroke="#7a7a7a" stroke-width="1"/>
  <polygon class="combo-arrow" points="451,44 461,44 456,51"/>
  <text class="label" x="180" y="70" text-anchor="end">TCPポート#:</text>
  <rect class="edit-box" x="190" y="58" width="60" height="18"/>
  <text class="label" x="196" y="72">23</text>
  <text class="label" x="276" y="70" text-anchor="end">IPバージョン:</text>
  <rect class="combo-box" x="280" y="58" width="88" height="18"/>
  <rect fill="#e1e1e1" x="348" y="58" width="20" height="18" stroke="#7a7a7a" stroke-width="1"/>
  <polygon class="combo-arrow" points="353,66 363,66 358,73"/>
  <text class="label" x="286" y="72">AUTO</text>
  <rect class="checkbox" x="190" y="82" width="13" height="13"/>
  <text class="label" x="208" y="93">Telnet</text>
  <rect class="group-box" x="8" y="134" width="466" height="48"/>
  <circle class="radio" cx="20" cy="160" r="6"/>
  <text class="label" x="32" y="164">シリアル</text>
  <text class="label" x="180" y="164" text-anchor="end">ポート:</text>
  <rect class="combo-box" x="190" y="152" width="276" height="20"/>
  <rect fill="#e1e1e1" x="446" y="152" width="20" height="20" stroke="#7a7a7a" stroke-width="1"/>
  <polygon class="combo-arrow" points="451,160 461,160 456,167"/>
  <rect class="button-default" x="130" y="194" width="64" height="24" rx="3"/>
  <text class="button-text-default" x="162" y="210">OK</text>
  <rect class="button" x="206" y="194" width="80" height="24" rx="3"/>
  <text class="button-text" x="246" y="210">キャンセル</text>
  <rect class="button" x="298" y="194" width="72" height="24" rx="3"/>
  <text class="button-text" x="334" y="210">ヘルプ(&H)</text>
</svg>