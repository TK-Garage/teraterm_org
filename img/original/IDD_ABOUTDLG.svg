<svg xmlns="http://www.w3.org/2000/svg" width="454" height="332" font-family="MS Shell Dlg, Tahoma, sans-serif" font-size="11">
  <defs>
    <style>
      .title-bar { fill: #0078d4; }
      .title-text { fill: white; font-size: 11px; font-weight: bold; }
      .dialog-bg { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .label { fill: #000; font-size: 11px; }
      .link { fill: #0066cc; font-size: 11px; text-decoration: underline; }
      .button-default { fill: #0078d4; stroke: #005a9e; stroke-width: 1; }
      .button-text-default { fill: #fff; font-size: 11px; text-anchor: middle; }
    </style>
  </defs>
  <rect class="title-bar" x="0" y="0" width="454" height="22" rx="4"/>
  <text class="title-text" x="8" y="15">About Tera Term</text>
  <rect class="dialog-bg" x="0" y="22" width="454" height="310"/>
  <!-- Icon placeholder -->
  <rect fill="#ddd" stroke="#999" x="12" y="38" width="40" height="40" rx="4"/>
  <text class="label" x="22" y="62" fill="#666">TT</text>
  <!-- Info text -->
  <text class="label" x="76" y="42" font-weight="bold" font-size="13">Tera Term</text>
  <text class="label" x="76" y="58">Version 5.x</text>
  <text class="label" x="86" y="72">(C) 2004-2026 TeraTerm Project</text>
  <text class="label" x="76" y="96">Includes:</text>
  <text class="label" x="76" y="112">Tera Term Pro version 2.3</text>
  <text class="label" x="86" y="126">Copyright (C) 1994-1998 T. Teranishi</text>
  <text class="label" x="76" y="146">IPv6 extention version 0.81</text>
  <text class="label" x="86" y="160">(C) 2000-2003 Jun-ya KATO</text>
  <text class="label" x="76" y="180">Oniguruma: x.x.x</text>
  <text class="label" x="76" y="196">SFMT: x.x</text>
  <text class="label" x="14" y="220">Build info:</text>
  <text class="label" fill="#666" x="14" y="236">Compiler / Platform information</text>
  <text class="label" x="14" y="296">Author:</text>
  <text class="link" x="72" y="296">https://teratermproject.github.io/</text>
  <!-- OK button -->
  <rect class="button-default" x="380" y="32" width="64" height="24" rx="3"/>
  <text class="button-text-default" x="412" y="48">OK</text>
</svg>
