<svg xmlns="http://www.w3.org/2000/svg" width="352" height="218" font-family="Tahoma, MS Shell Dlg, sans-serif" font-size="11">
  <defs>
    <style>
      .title-bar { fill: #0078d4; }
      .title-text { fill: white; font-size: 11px; font-weight: bold; }
      .dialog-bg { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .label { fill: #000; font-size: 11px; }
      .edit-box { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .button { fill: #e1e1e1; stroke: #adadad; stroke-width: 1; }
      .button-text { fill: #000; font-size: 11px; text-anchor: middle; }
      .progress-bg { fill: #e0e0e0; stroke: #999; stroke-width: 1; }
      .progress-fg { fill: #0078d4; }
    </style>
  </defs>
  <rect class="title-bar" x="0" y="0" width="352" height="22" rx="4"/>
  <text class="title-text" x="8" y="15">File Transfer</text>
  <rect class="dialog-bg" x="0" y="22" width="352" height="196"/>
  <text class="label" x="16" y="44">Filename:</text>
  <rect class="edit-box" x="16" y="50" width="316" height="18"/>
  <text class="label" x="22" y="63" fill="#666">example.txt</text>
  <text class="label" x="16" y="82">Full path:</text>
  <rect class="edit-box" x="16" y="88" width="316" height="18"/>
  <text class="label" x="270" y="118" text-anchor="end">Bytes: 0</text>
  <text class="label" x="16" y="118">Elapsed:</text>
  <text class="label" x="80" y="118">00:00:00</text>
  <!-- Progress bar -->
  <rect class="progress-bg" x="16" y="128" width="316" height="16" rx="2"/>
  <rect class="progress-fg" x="16" y="128" width="100" height="16" rx="2"/>
  <!-- Buttons -->
  <rect class="button" x="16" y="156" width="80" height="24" rx="3"/>
  <text class="button-text" x="56" y="172">Hide</text>
  <rect class="button" x="110" y="156" width="80" height="24" rx="3"/>
  <text class="button-text" x="150" y="172">Cancel</text>
  <rect class="button" x="204" y="156" width="80" height="24" rx="3"/>
  <text class="button-text" x="244" y="172">Pause</text>
  <rect class="button" x="298" y="156" width="40" height="24" rx="3"/>
  <text class="button-text" x="318" y="172">Help</text>
</svg>
