<svg xmlns="http://www.w3.org/2000/svg" width="540" height="400" font-family="Tahoma, MS Shell Dlg, sans-serif" font-size="11">
  <defs>
    <style>
      .dialog-bg { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .label { fill: #000; font-size: 11px; }
      .combo-box { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .checkbox { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .combo-arrow { fill: #606060; }
      .tab-active { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .tab-inactive { fill: #e0e0e0; stroke: #999; stroke-width: 1; }
      .tab-text { fill: #000; font-size: 10px; text-anchor: middle; }
    </style>
  </defs>
  <rect class="tab-inactive" x="0" y="0" width="60" height="24" rx="3"/>
  <text class="tab-text" x="30" y="16">General</text>
  <rect class="tab-active" x="62" y="0" width="70" height="24" rx="3"/>
  <text class="tab-text" x="97" y="16" font-weight="bold">Sequence</text>
  <rect class="dialog-bg" x="0" y="22" width="540" height="378"/>
  <rect class="checkbox" x="16" y="36" width="13" height="13"/>
  <text class="label" x="34" y="47">Accept mouse event tracking</text>
  <rect class="checkbox" x="16" y="56" width="13" height="13"/>
  <text class="label" x="34" y="67">Disable mouse tracking ctrl</text>
  <text class="label" x="16" y="94">Accept title changing:</text>
  <rect class="combo-box" x="160" y="82" width="160" height="20"/>
  <rect fill="#e1e1e1" x="300" y="82" width="20" height="20" stroke="#7a7a7a" stroke-width="1"/>
  <polygon class="combo-arrow" points="305,90 315,90 310,97"/>
  <text class="label" x="16" y="120">Title report:</text>
  <rect class="combo-box" x="160" y="108" width="160" height="20"/>
  <rect fill="#e1e1e1" x="300" y="108" width="20" height="20" stroke="#7a7a7a" stroke-width="1"/>
  <polygon class="combo-arrow" points="305,116 315,116 310,123"/>
  <rect class="checkbox" x="16" y="138" width="13" height="13"/>
  <text class="label" x="34" y="149">Window control sequence</text>
  <rect class="checkbox" x="16" y="158" width="13" height="13"/>
  <text class="label" x="34" y="169">Window report sequence</text>
  <rect class="checkbox" x="16" y="178" width="13" height="13"/>
  <text class="label" x="34" y="189">Cursor control sequence</text>
  <text class="label" x="16" y="216">Clipboard access:</text>
  <rect class="combo-box" x="160" y="204" width="160" height="20"/>
  <rect fill="#e1e1e1" x="300" y="204" width="20" height="20" stroke="#7a7a7a" stroke-width="1"/>
  <polygon class="combo-arrow" points="305,212 315,212 310,219"/>
  <rect class="checkbox" x="16" y="234" width="13" height="13"/>
  <text class="label" x="34" y="245">Clipboard notify</text>
  <rect class="checkbox" x="16" y="254" width="13" height="13"/>
  <text class="label" x="34" y="265">Accept clear scroll buffer</text>
  <rect class="checkbox" x="16" y="274" width="13" height="13"/>
  <text class="label" x="34" y="285">Disable print start</text>
  <text class="label" x="16" y="312">Beep:</text>
  <rect class="combo-box" x="160" y="300" width="160" height="20"/>
  <rect fill="#e1e1e1" x="300" y="300" width="20" height="20" stroke="#7a7a7a" stroke-width="1"/>
  <polygon class="combo-arrow" points="305,308 315,308 310,315"/>
</svg>
