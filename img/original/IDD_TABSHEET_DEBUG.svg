<svg xmlns="http://www.w3.org/2000/svg" width="540" height="220" font-family="Tahoma, MS Shell Dlg, sans-serif" font-size="11">
  <defs>
    <style>
      .dialog-bg { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .label { fill: #000; font-size: 11px; }
      .combo-box { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .checkbox { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .button { fill: #e1e1e1; stroke: #adadad; stroke-width: 1; }
      .button-text { fill: #000; font-size: 11px; text-anchor: middle; }
      .combo-arrow { fill: #606060; }
      .tab-active { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .tab-text { fill: #000; font-size: 10px; text-anchor: middle; }
    </style>
  </defs>
  <rect class="tab-active" x="0" y="0" width="50" height="24" rx="3"/>
  <text class="tab-text" x="25" y="16" font-weight="bold">Debug</text>
  <rect class="dialog-bg" x="0" y="22" width="540" height="198"/>
  <rect class="checkbox" x="16" y="40" width="13" height="13"/>
  <text class="label" x="34" y="51">Enable character info popup</text>
  <text class="label" x="16" y="76">Key 1:</text>
  <rect class="combo-box" x="80" y="64" width="160" height="20"/>
  <rect fill="#e1e1e1" x="220" y="64" width="20" height="20" stroke="#7a7a7a" stroke-width="1"/>
  <polygon class="combo-arrow" points="225,72 235,72 230,79"/>
  <text class="label" x="260" y="76">Key 2:</text>
  <rect class="combo-box" x="310" y="64" width="160" height="20"/>
  <rect fill="#e1e1e1" x="450" y="64" width="20" height="20" stroke="#7a7a7a" stroke-width="1"/>
  <polygon class="combo-arrow" points="455,72 465,72 460,79"/>
  <rect class="button" x="16" y="100" width="160" height="24" rx="3"/>
  <text class="button-text" x="96" y="116">Display console window</text>
  <rect class="button" x="200" y="100" width="80" height="24" rx="3"/>
  <text class="button-text" x="240" y="116">Dump</text>
</svg>
