<svg xmlns="http://www.w3.org/2000/svg" width="540" height="260" font-family="Tahoma, MS Shell Dlg, sans-serif" font-size="11">
  <defs>
    <style>
      .dialog-bg { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .label { fill: #000; font-size: 11px; }
      .edit-box { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .combo-box { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .checkbox { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .button { fill: #e1e1e1; stroke: #adadad; stroke-width: 1; }
      .button-text { fill: #000; font-size: 11px; text-anchor: middle; }
      .combo-arrow { fill: #606060; }
      .tab-active { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .tab-text { fill: #000; font-size: 10px; text-anchor: middle; }
    </style>
  </defs>
  <rect class="tab-active" x="0" y="0" width="30" height="24" rx="3"/>
  <text class="tab-text" x="15" y="16" font-weight="bold">UI</text>
  <rect class="dialog-bg" x="0" y="22" width="540" height="238"/>
  <text class="label" x="16" y="44">UI Language:</text>
  <rect class="combo-box" x="120" y="32" width="200" height="20"/>
  <rect fill="#e1e1e1" x="300" y="32" width="20" height="20" stroke="#7a7a7a" stroke-width="1"/>
  <polygon class="combo-arrow" points="305,40 315,40 310,47"/>
  <text class="label" x="126" y="46">English</text>
  <text class="label" x="16" y="74">Dialog font:</text>
  <rect class="edit-box" x="120" y="62" width="260" height="20"/>
  <rect class="button" x="390" y="62" width="70" height="20" rx="2"/>
  <text class="button-text" x="425" y="76">Select...</text>
  <rect class="button" x="466" y="62" width="60" height="20" rx="2"/>
  <text class="button-text" x="496" y="76">Default</text>
  <rect class="checkbox" x="16" y="92" width="13" height="13"/>
  <text class="label" x="34" y="103">List proportional fonts</text>
  <rect class="checkbox" x="200" y="92" width="13" height="13"/>
  <text class="label" x="218" y="103">List hidden fonts</text>
  <text class="label" fill="#0066cc" x="16" y="130" text-decoration="underline">Open font folder</text>
</svg>
