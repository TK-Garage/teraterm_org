<svg xmlns="http://www.w3.org/2000/svg" width="540" height="360" font-family="Tahoma, MS Shell Dlg, sans-serif" font-size="11">
  <defs>
    <style>
      .dialog-bg { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .label { fill: #000; font-size: 11px; }
      .edit-box { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .checkbox { fill: #fff; stroke: #7a7a7a; stroke-width: 1; }
      .button { fill: #e1e1e1; stroke: #adadad; stroke-width: 1; }
      .button-text { fill: #000; font-size: 11px; text-anchor: middle; }
      .tab-active { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .tab-inactive { fill: #e0e0e0; stroke: #999; stroke-width: 1; }
      .tab-text { fill: #000; font-size: 10px; text-anchor: middle; }
    </style>
  </defs>
  <rect class="tab-inactive" x="273" y="0" width="40" height="24" rx="3"/>
  <text class="tab-text" x="293" y="16">Log</text>
  <rect class="tab-active" x="414" y="0" width="55" height="24" rx="3"/>
  <text class="tab-text" x="441" y="16" font-weight="bold">Cygwin</text>
  <rect class="dialog-bg" x="0" y="22" width="540" height="338"/>
  <text class="label" x="16" y="44">Cygwin path:</text>
  <rect class="edit-box" x="120" y="32" width="340" height="20"/>
  <rect class="button" x="466" y="32" width="50" height="20" rx="2"/>
  <text class="button-text" x="491" y="46">Select</text>
  <text class="label" x="16" y="70">Term:</text>
  <rect class="edit-box" x="120" y="58" width="180" height="20"/>
  <text class="label" x="16" y="96">Term type:</text>
  <rect class="edit-box" x="120" y="84" width="180" height="20"/>
  <text class="label" x="16" y="122">Port start:</text>
  <rect class="edit-box" x="120" y="110" width="80" height="20"/>
  <text class="label" x="220" y="122">Port range:</text>
  <rect class="edit-box" x="300" y="110" width="80" height="20"/>
  <text class="label" x="16" y="148">Shell:</text>
  <rect class="edit-box" x="120" y="136" width="380" height="20"/>
  <text class="label" x="16" y="174">Env1:</text>
  <rect class="edit-box" x="120" y="162" width="380" height="20"/>
  <text class="label" x="16" y="200">Env2:</text>
  <rect class="edit-box" x="120" y="188" width="380" height="20"/>
  <rect class="checkbox" x="16" y="220" width="13" height="13"/>
  <text class="label" x="34" y="231">Login shell</text>
  <rect class="checkbox" x="16" y="244" width="13" height="13"/>
