<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="260" viewBox="0 0 520 260">
  <defs>
    <style>
      .bg { fill: #ECECEC; }
      .border { fill: none; stroke: red; stroke-width: 2; }
      .box { fill: #F6F6F6; stroke: #C0C0C0; stroke-width: 1; rx: 4; }
      .label { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 13px; fill: #333; }
      .label-right { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 13px; fill: #333; text-anchor: end; }
      .title { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 13px; fill: #333; font-weight: 600; }
      .field { fill: #FFF; stroke: #B0B0B0; stroke-width: 1; rx: 3; }
      .radio-circle { fill: none; stroke: #666; stroke-width: 1.5; }
      .radio-dot { fill: #007AFF; }
      .combo { fill: #FFF; stroke: #B0B0B0; stroke-width: 1; rx: 3; }
      .dim { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 11px; fill: #999; }
      .size-label { font-family: monospace; font-size: 10px; fill: red; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="520" height="260" class="bg"/>
  <!-- 2pt red boundary -->
  <rect x="1" y="1" width="518" height="258" class="border"/>

  <!-- Window title bar -->
  <rect x="0" y="0" width="520" height="22" fill="#E8E8E8" stroke="#C0C0C0" stroke-width="1"/>
  <text x="260" y="15" class="title" text-anchor="middle">Tera Term: New Connection</text>
  <!-- Traffic lights -->
  <circle cx="14" cy="11" r="5" fill="#FF5F57"/>
  <circle cx="30" cy="11" r="5" fill="#FEBC2E"/>
  <circle cx="46" cy="11" r="5" fill="#28C840"/>

  <!-- TCP/IP Group Box -->
  <rect x="20" y="30" width="480" height="145" class="box"/>

  <!-- Row 1: TCP/IP radio + Host + ComboBox -->
  <circle cx="36" cy="52" r="6" class="radio-circle"/>
  <circle cx="36" cy="52" r="3" class="radio-dot"/>
  <text x="48" y="56" class="label">TCP/IP</text>
  <text x="108" y="56" class="label-right">Host:</text>
  <rect x="118" y="40" width="280" height="22" class="combo"/>
  <text x="126" y="55" class="label" fill="#999">example.host.com</text>
  <!-- ComboBox dropdown arrow -->
  <polygon points="386,48 392,48 389,54" fill="#666"/>

  <!-- Row 2: Service: Telnet + TCP port# -->
  <text x="84" y="82" class="label-right">Service:</text>
  <circle cx="100" cy="78" r="6" class="radio-circle"/>
  <circle cx="100" cy="78" r="3" class="radio-dot"/>
  <text x="112" y="82" class="label">Telnet</text>
  <text x="260" y="82" class="label-right">TCP port#:</text>
  <rect x="270" y="68" width="60" height="22" class="field"/>
  <text x="278" y="83" class="label">23</text>

  <!-- Row 3: SSH + SSH version -->
  <circle cx="100" cy="104" r="6" class="radio-circle"/>
  <text x="112" y="108" class="label">SSH</text>
  <text x="260" y="108" class="label-right">SSH version:</text>
  <rect x="270" y="94" width="80" height="22" class="field"/>
  <text x="278" y="109" class="label" fill="#999">SSH2</text>

  <!-- Row 4: Other + IP version -->
  <circle cx="100" cy="130" r="6" class="radio-circle"/>
  <text x="112" y="134" class="label">Other</text>
  <text x="260" y="134" class="label-right">IP version:</text>
  <rect x="270" y="120" width="80" height="22" class="field"/>
  <text x="278" y="135" class="label" fill="#999">AUTO</text>

  <!-- Serial Group Box -->
  <rect x="20" y="187" width="480" height="35" class="box"/>
  <circle cx="36" cy="206" r="6" class="radio-circle"/>
  <text x="48" y="210" class="label">Serial</text>
  <text x="130" y="210" class="label-right">Port:</text>
  <rect x="140" y="196" width="200" height="22" class="field"/>
  <text x="148" y="211" class="label" fill="#999">/dev/tty.usbserial</text>

  <!-- Size annotation -->
  <text x="510" y="255" class="size-label" text-anchor="end">520 x 260</text>
</svg>
